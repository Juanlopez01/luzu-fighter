// Online multiplayer via Supabase Realtime
const supa=window.supabase.createClient(SUPA_URL,SUPA_KEY);

function genRoomCode(){return Math.random().toString(36).substring(2,6).toUpperCase()}

function cleanupOnline(){
  if(onlineChannel){supa.removeChannel(onlineChannel);onlineChannel=null}
  onlineRole=null;remoteInput=null;onlineConnected=false;lobbyMsg='';
}

function setupChannel(code){
  roomCode=code;
  onlineChannel=supa.channel('room-'+code,{config:{broadcast:{self:false}}});

  onlineChannel.on('broadcast',{event:'input'},({payload})=>{
    remoteInput=payload;
  });
  onlineChannel.on('broadcast',{event:'charSelect'},({payload})=>{
    if(onlineRole==='host'){p2Sel=payload.sel;p2Tab=payload.tab;if(payload.ready)p2Ready=true}
    else{p1Sel=payload.sel;p1Tab=payload.tab;if(payload.ready)p1Ready=true}
  });
  onlineChannel.on('broadcast',{event:'join'},()=>{
    onlineConnected=true;lobbyMsg='CONECTADO!';
    sfx('bell');
    gameState='charSelect';p1Sel=0;p2Sel=0;p1Ready=false;p2Ready=false;selectDelay=0;
  });
  onlineChannel.on('broadcast',{event:'start'},({payload})=>{
    p1Sel=payload.p1Sel;p2Sel=payload.p2Sel;
    startGame();
  });
  onlineChannel.on('broadcast',{event:'rematch'},()=>{
    startGame();
  });
  onlineChannel.on('broadcast',{event:'leave'},()=>{
    lobbyMsg='OPONENTE DESCONECTADO';onlineConnected=false;
    sfx('ko');gameState='title';titleDelay=0;cleanupOnline();
  });

  return onlineChannel.subscribe((status)=>{
    if(status==='SUBSCRIBED'&&onlineRole==='host'){
      lobbyMsg='ESPERANDO OPONENTE...';
    }
  });
}

function createRoom(){
  onlineRole='host';
  const code=genRoomCode();
  lobbyMsg='CONECTANDO...';
  setupChannel(code);
}

function joinRoom(code){
  onlineRole='guest';roomCode=code;
  lobbyMsg='CONECTANDO...';
  setupChannel(code).then(()=>{
    onlineChannel.send({type:'broadcast',event:'join',payload:{}});
    onlineConnected=true;
    gameState='charSelect';p1Sel=0;p2Sel=0;p1Ready=false;p2Ready=false;selectDelay=0;
    sfx('bell');
  });
}

function sendOnlineInput(inp){
  if(!onlineChannel||!onlineConnected)return;
  onlineChannel.send({type:'broadcast',event:'input',payload:inp});
}

function sendCharSelect(){
  if(!onlineChannel)return;
  const sel=onlineRole==='host'?p1Sel:p2Sel;
  const tab=onlineRole==='host'?p1Tab:p2Tab;
  const ready=onlineRole==='host'?p1Ready:p2Ready;
  onlineChannel.send({type:'broadcast',event:'charSelect',payload:{sel,tab,ready}});
}

// Audio
let audio, muted=false;
function initAudio(){if(audio)return;try{audio=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}
function sfx(type){
  if(!audio||muted)return;
  const t=audio.currentTime,g=audio.createGain();g.connect(audio.destination);
  if(type==='hit'){
    const o=audio.createOscillator();o.type='square';
    o.frequency.setValueAtTime(400,t);o.frequency.exponentialRampToValueAtTime(80,t+0.08);
    g.gain.setValueAtTime(0.15,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.08);
    o.connect(g);o.start(t);o.stop(t+0.08);
  }else if(type==='heavy'){
    const o=audio.createOscillator();o.type='sawtooth';
    o.frequency.setValueAtTime(200,t);o.frequency.exponentialRampToValueAtTime(40,t+0.15);
    g.gain.setValueAtTime(0.2,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.15);
    o.connect(g);o.start(t);o.stop(t+0.15);
  }else if(type==='ko'){
    const o=audio.createOscillator();o.type='sine';
    o.frequency.setValueAtTime(120,t);o.frequency.exponentialRampToValueAtTime(30,t+0.4);
    g.gain.setValueAtTime(0.3,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.4);
    o.connect(g);o.start(t);o.stop(t+0.4);
  }else if(type==='bell'){
    [523,659,784].forEach((f,i)=>{
      const o=audio.createOscillator();o.type='sine';o.frequency.value=f;
      const gg=audio.createGain();gg.gain.setValueAtTime(0.12,t+i*0.08);
      gg.gain.exponentialRampToValueAtTime(0.001,t+i*0.08+0.3);
      o.connect(gg).connect(audio.destination);o.start(t+i*0.08);o.stop(t+i*0.08+0.3);
    });
  }else if(type==='whoosh'){
    const buf=audio.createBuffer(1,audio.sampleRate*0.15,audio.sampleRate);
    const d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);
    const src=audio.createBufferSource();src.buffer=buf;
    const flt=audio.createBiquadFilter();flt.type='bandpass';
    flt.frequency.setValueAtTime(2000,t);flt.frequency.exponentialRampToValueAtTime(400,t+0.15);
    g.gain.setValueAtTime(0.15,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.15);
    src.connect(flt).connect(g);src.start(t);src.stop(t+0.15);
  }else if(type==='select'){
    const o=audio.createOscillator();o.type='square';
    o.frequency.setValueAtTime(880,t);o.frequency.setValueAtTime(1100,t+0.05);
    g.gain.setValueAtTime(0.08,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.12);
    o.connect(g);o.start(t);o.stop(t+0.12);
  }else if(type==='confirm'){
    [660,880,1100].forEach((f,i)=>{
      const o=audio.createOscillator();o.type='square';o.frequency.value=f;
      const gg=audio.createGain();gg.gain.setValueAtTime(0.1,t+i*0.06);
      gg.gain.exponentialRampToValueAtTime(0.001,t+i*0.06+0.15);
      o.connect(gg).connect(audio.destination);o.start(t+i*0.06);o.stop(t+i*0.06+0.15);
    });
  }else if(type==='super'){
    [440,660,880,1100].forEach((f,i)=>{
      const o=audio.createOscillator();o.type='sawtooth';o.frequency.value=f;
      const gg=audio.createGain();gg.gain.setValueAtTime(0.15,t+i*0.05);
      gg.gain.exponentialRampToValueAtTime(0.001,t+i*0.05+0.25);
      o.connect(gg).connect(audio.destination);o.start(t+i*0.05);o.stop(t+i*0.05+0.25);
    });
  }else if(type==='block'){
    const o=audio.createOscillator();o.type='triangle';
    o.frequency.setValueAtTime(300,t);o.frequency.setValueAtTime(200,t+0.05);
    g.gain.setValueAtTime(0.1,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.08);
    o.connect(g);o.start(t);o.stop(t+0.08);
  }else if(type==='dash'){
    const buf=audio.createBuffer(1,audio.sampleRate*0.1,audio.sampleRate);
    const d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length)*0.5;
    const src=audio.createBufferSource();src.buffer=buf;
    g.gain.setValueAtTime(0.1,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.1);
    src.connect(g);src.start(t);src.stop(t+0.1);
  }else if(type==='pause'){
    const o=audio.createOscillator();o.type='sine';o.frequency.value=440;
    g.gain.setValueAtTime(0.08,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.15);
    o.connect(g);o.start(t);o.stop(t+0.15);
  }
}

// Assets
const charSprites={};
let loaded=false, loadPct=0;
function loadImg(src){
  return new Promise(r=>{
    const img=new Image();
    img.onload=()=>r(img);
    img.onerror=()=>{const c=document.createElement('canvas');c.width=300;c.height=200;r(c)};
    img.src=src;
  });
}
function tint(img,deg){
  const c=document.createElement('canvas');c.width=img.naturalWidth||img.width;c.height=img.naturalHeight||img.height;
  const x=c.getContext('2d');x.filter=`hue-rotate(${deg}deg) saturate(1.2) brightness(1.05)`;
  x.drawImage(img,0,0);return c;
}
async function loadAssets(){
  const entries=Object.entries(SPRITE_FILES);
  const totalFiles=entries.reduce((s,e)=>s+e[1].length,0);
  let done=0;const totalAll=totalFiles*CHARACTERS.length;
  // Parallel load per character
  const loadChar=async(char)=>{
    charSprites[char.id]={raw:{},tinted:{}};
    for(const[state,files]of entries){
      charSprites[char.id].raw[state]=[];
      charSprites[char.id].tinted[state]=[];
      for(const f of files){
        const img=await loadImg(`${char.folder}/${f}`);
        charSprites[char.id].raw[state].push(img);
        charSprites[char.id].tinted[state].push(tint(img,320));
        done++;loadPct=done/totalAll;
      }
    }
  };
  await Promise.all(CHARACTERS.map(c=>loadChar(c)));
  loaded=true;
}

// Mobile touch controls
const isMobile='ontouchstart'in window||navigator.maxTouchPoints>0;
const touch={active:false,dpad:{x:0,y:0},btns:{punch:false,kick:false,special:false},pause:false};
const DPAD_CX=140,DPAD_CY=540,DPAD_R=70;
const BTN_R=38;
const BTN_PUNCH={x:GW-180,y:500},BTN_KICK={x:GW-100,y:540},BTN_SPECIAL={x:GW-140,y:450};
const BTN_PAUSE={x:GW/2,y:16,w:60,h:28};
let touchIds={};

function canvasXY(t){
  const r=cvs.getBoundingClientRect();
  return{x:(t.clientX-r.left)*(GW/r.width),y:(t.clientY-r.top)*(GH/r.height)};
}
function distSq(ax,ay,bx,by){return(ax-bx)**2+(ay-by)**2}

function processTouches(touches){
  touch.dpad.x=0;touch.dpad.y=0;
  touch.btns.punch=false;touch.btns.kick=false;touch.btns.special=false;
  touch.pause=false;
  for(let i=0;i<touches.length;i++){
    const p=canvasXY(touches[i]);
    // D-pad zone (left half)
    if(p.x<GW/2){
      const dx=p.x-DPAD_CX,dy=p.y-DPAD_CY;
      if(dx*dx+dy*dy<(DPAD_R*2)**2){
        if(Math.abs(dx)>20)touch.dpad.x=dx>0?1:-1;
        if(Math.abs(dy)>20)touch.dpad.y=dy>0?1:-1;
      }
    }
    // Buttons (right half)
    if(p.x>GW/2){
      if(distSq(p.x,p.y,BTN_PUNCH.x,BTN_PUNCH.y)<(BTN_R+10)**2)touch.btns.punch=true;
      if(distSq(p.x,p.y,BTN_KICK.x,BTN_KICK.y)<(BTN_R+10)**2)touch.btns.kick=true;
      if(distSq(p.x,p.y,BTN_SPECIAL.x,BTN_SPECIAL.y)<(BTN_R+10)**2)touch.btns.special=true;
    }
    // Pause button
    if(p.x>BTN_PAUSE.x-BTN_PAUSE.w&&p.x<BTN_PAUSE.x+BTN_PAUSE.w&&p.y<BTN_PAUSE.h*2)touch.pause=true;
  }
}
let lastPause=false;
function applyTouch(){
  if(!isMobile)return;
  keys['KeyA']=touch.dpad.x<0;keys['KeyD']=touch.dpad.x>0;
  keys['KeyW']=touch.dpad.y<0;keys['KeyS']=touch.dpad.y>0;
  keys['KeyF']=touch.btns.punch;keys['KeyG']=touch.btns.kick;keys['KeyH']=touch.btns.special;
  if(touch.pause&&!lastPause){
    if(gameState==='fighting'){paused=!paused;sfx('pause')}
    else if(gameState==='charSelect'){gameState='title';titleDelay=0;sfx('pause')}
  }
  lastPause=touch.pause;
}

if(isMobile){
  cvs.addEventListener('touchstart',e=>{
    e.preventDefault();processTouches(e.touches);
    if(gameState==='title'||gameState==='matchEnd'){
      const p=canvasXY(e.touches[0]);
      if(gameState==='title'){
        if(p.y<380)menuSel=0;else if(p.y<425)menuSel=1;else menuSel=2;
        keys['Enter']=true;setTimeout(()=>{keys['Enter']=false},80);
      }else{
        keys['Enter']=true;setTimeout(()=>{keys['Enter']=false},80);
      }
    }
    if(gameState==='charSelect'){
      const p=canvasXY(e.touches[0]);
      const activeTab=!p1Ready?p1Tab:p2Tab;
      const slotW=140,slotH=160,gap=14,slotY=82;
      const chars=charsInTab(activeTab);
      const totalW=chars.length*slotW+(chars.length-1)*gap;
      const startX=(GW-totalW)/2;
      // Tap on program tabs
      const tabY=48,tabH=24,tabGap=10,tabW=180;
      const tabTotalW=PROGRAMS.length*tabW+(PROGRAMS.length-1)*tabGap;
      const tabStartX=(GW-tabTotalW)/2;
      for(let t=0;t<PROGRAMS.length;t++){
        const tx=tabStartX+t*(tabW+tabGap);
        if(p.x>=tx&&p.x<=tx+tabW&&p.y>=tabY&&p.y<=tabY+tabH){
          if(!p1Ready){p1Tab=t;p1Sel=globalIdx(t,0);sfx('select')}
          break;
        }
      }
      // Tap on character slot
      for(let ci=0;ci<chars.length;ci++){
        const sx=startX+ci*(slotW+gap);
        if(p.x>=sx&&p.x<=sx+slotW&&p.y>=slotY&&p.y<=slotY+slotH){
          if(!p1Ready){p1Sel=CHARACTERS.indexOf(chars[ci]);sfx('select')}
          break;
        }
      }
      if(!p1Ready&&p.y>GH-80){p1Ready=true;sfx('confirm')}
    }
  },{passive:false});
  cvs.addEventListener('touchmove',e=>{e.preventDefault();processTouches(e.touches)},{passive:false});
  cvs.addEventListener('touchend',e=>{e.preventDefault();processTouches(e.touches)},{passive:false});
  cvs.addEventListener('touchcancel',e=>{e.preventDefault();processTouches(e.touches)},{passive:false});
}

function drawTouchControls(){
  if(!isMobile)return;
  ctx.save();
  ctx.globalAlpha=0.3;
  // D-pad
  ctx.strokeStyle='#fff';ctx.lineWidth=3;
  ctx.beginPath();ctx.arc(DPAD_CX,DPAD_CY,DPAD_R,0,Math.PI*2);ctx.stroke();
  ctx.fillStyle='#fff';
  // Arrows
  const aw=14,ah=20;
  // Up
  ctx.beginPath();ctx.moveTo(DPAD_CX,DPAD_CY-DPAD_R+10);ctx.lineTo(DPAD_CX-aw,DPAD_CY-DPAD_R+10+ah);ctx.lineTo(DPAD_CX+aw,DPAD_CY-DPAD_R+10+ah);ctx.fill();
  // Down
  ctx.beginPath();ctx.moveTo(DPAD_CX,DPAD_CY+DPAD_R-10);ctx.lineTo(DPAD_CX-aw,DPAD_CY+DPAD_R-10-ah);ctx.lineTo(DPAD_CX+aw,DPAD_CY+DPAD_R-10-ah);ctx.fill();
  // Left
  ctx.beginPath();ctx.moveTo(DPAD_CX-DPAD_R+10,DPAD_CY);ctx.lineTo(DPAD_CX-DPAD_R+10+ah,DPAD_CY-aw);ctx.lineTo(DPAD_CX-DPAD_R+10+ah,DPAD_CY+aw);ctx.fill();
  // Right
  ctx.beginPath();ctx.moveTo(DPAD_CX+DPAD_R-10,DPAD_CY);ctx.lineTo(DPAD_CX+DPAD_R-10-ah,DPAD_CY-aw);ctx.lineTo(DPAD_CX+DPAD_R-10-ah,DPAD_CY+aw);ctx.fill();

  // Highlight active directions
  ctx.globalAlpha=0.5;
  if(touch.dpad.x<0){ctx.fillStyle='#4488ff';ctx.beginPath();ctx.arc(DPAD_CX-40,DPAD_CY,18,0,Math.PI*2);ctx.fill()}
  if(touch.dpad.x>0){ctx.fillStyle='#4488ff';ctx.beginPath();ctx.arc(DPAD_CX+40,DPAD_CY,18,0,Math.PI*2);ctx.fill()}
  if(touch.dpad.y<0){ctx.fillStyle='#4488ff';ctx.beginPath();ctx.arc(DPAD_CX,DPAD_CY-40,18,0,Math.PI*2);ctx.fill()}
  if(touch.dpad.y>0){ctx.fillStyle='#4488ff';ctx.beginPath();ctx.arc(DPAD_CX,DPAD_CY+40,18,0,Math.PI*2);ctx.fill()}

  // Attack buttons
  ctx.globalAlpha=touch.btns.punch?0.6:0.3;
  ctx.fillStyle='#ff4444';ctx.beginPath();ctx.arc(BTN_PUNCH.x,BTN_PUNCH.y,BTN_R,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#ff6666';ctx.lineWidth=2;ctx.stroke();
  ctx.globalAlpha=touch.btns.kick?0.6:0.3;
  ctx.fillStyle='#44aaff';ctx.beginPath();ctx.arc(BTN_KICK.x,BTN_KICK.y,BTN_R,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#66ccff';ctx.stroke();
  ctx.globalAlpha=touch.btns.special?0.6:0.3;
  ctx.fillStyle='#ffaa00';ctx.beginPath();ctx.arc(BTN_SPECIAL.x,BTN_SPECIAL.y,BTN_R,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#ffcc44';ctx.stroke();

  // Button labels
  ctx.globalAlpha=0.6;ctx.font='10px "Press Start 2P",monospace';ctx.textAlign='center';ctx.fillStyle='#fff';
  ctx.fillText('P',BTN_PUNCH.x,BTN_PUNCH.y+4);
  ctx.fillText('K',BTN_KICK.x,BTN_KICK.y+4);
  ctx.fillText('SP',BTN_SPECIAL.x,BTN_SPECIAL.y+4);

  // Pause button
  ctx.globalAlpha=0.35;ctx.fillStyle='#888';
  ctx.fillRect(BTN_PAUSE.x-BTN_PAUSE.w/2,BTN_PAUSE.y,BTN_PAUSE.w,BTN_PAUSE.h);
  ctx.font='8px "Press Start 2P",monospace';ctx.fillStyle='#fff';ctx.globalAlpha=0.5;
  ctx.fillText('||',BTN_PAUSE.x,BTN_PAUSE.y+18);

  ctx.restore();
}

const P1_MAP={left:'KeyA',right:'KeyD',jump:'KeyW',crouch:'KeyS',punch:'KeyF',kick:'KeyG',special:'KeyH'};
const P2_MAP={left:'ArrowLeft',right:'ArrowRight',jump:'ArrowUp',crouch:'ArrowDown',punch:'KeyJ',kick:'KeyK',special:'KeyL'};

function input(map){
  return{
    left:!!keys[map.left],right:!!keys[map.right],
    jump:!!keys[map.jump],crouch:!!keys[map.crouch],
    punch:!!keys[map.punch],kick:!!keys[map.kick],special:!!keys[map.special],
    dashL:!!tapTimes[map.left+'_dash'],dashR:!!tapTimes[map.right+'_dash']
  };
}

// Particles
const particles=[];
function spawnHit(x,y,count){
  for(let i=0;i<count;i++){
    const a=Math.random()*Math.PI*2,spd=2+Math.random()*6;
    particles.push({x,y:y-80,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd-2,
      life:20+Math.random()*15,maxLife:35,size:2+Math.random()*4,
      color:['#fff','#ffd700','#ff6b35','#ff3333'][Math.floor(Math.random()*4)]});
  }
}
function spawnDust(x,y){
  for(let i=0;i<6;i++)particles.push({x:x+(Math.random()-0.5)*40,y,
    vx:(Math.random()-0.5)*3,vy:-Math.random()*2,life:15+Math.random()*10,maxLife:25,
    size:3+Math.random()*5,color:'rgba(200,180,150,0.5)'});
}
function spawnBlock(x,y){
  for(let i=0;i<8;i++){
    const a=-Math.PI/2+(Math.random()-0.5)*1.5,spd=3+Math.random()*4;
    particles.push({x,y:y-80,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,
      life:15+Math.random()*10,maxLife:25,size:2+Math.random()*3,color:'#66ccff'});
  }
}
function spawnSuper(x,y){
  for(let i=0;i<25;i++){
    const a=Math.random()*Math.PI*2,spd=3+Math.random()*8;
    particles.push({x,y:y-100,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd-3,
      life:25+Math.random()*20,maxLife:45,size:3+Math.random()*6,
      color:['#ffd700','#ff6ec7','#fff','#ffaa00'][Math.floor(Math.random()*4)]});
  }
}
function updateParticles(){
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];p.x+=p.vx;p.y+=p.vy;p.vy+=0.15;p.life--;
    if(p.life<=0)particles.splice(i,1);
  }
}
function drawParticles(){
  for(const p of particles){
    ctx.globalAlpha=p.life/p.maxLife;ctx.fillStyle=p.color;
    ctx.fillRect(p.x-p.size/2,p.y-p.size/2,p.size,p.size);
  }
  ctx.globalAlpha=1;
}

// Floating text
const floats=[];
function spawnFloat(text,x,y,color,size){
  floats.push({text,x,y,vy:-2.5,life:50,maxLife:50,color,size:size||16});
}
function updateFloats(){
  for(let i=floats.length-1;i>=0;i--){
    const f=floats[i];f.y+=f.vy;f.vy*=0.96;f.life--;
    if(f.life<=0)floats.splice(i,1);
  }
}
function drawFloats(){
  for(const f of floats){
    ctx.globalAlpha=Math.min(1,f.life/15);ctx.fillStyle=f.color;
    ctx.font=`${f.size}px "Press Start 2P",monospace`;ctx.textAlign='center';
    ctx.strokeStyle='#000';ctx.lineWidth=4;
    ctx.strokeText(f.text,f.x,f.y);ctx.fillText(f.text,f.x,f.y);
  }
  ctx.globalAlpha=1;
}

// Projectiles
const projectiles=[];
function spawnProjectile(owner,x,y,facing,sprites,isSuper){
  projectiles.push({x,y:y-100,vx:(isSuper?12:9)*facing,owner,
    sprites,frame:0,w:isSuper?220:160,h:isSuper?140:100,isSuper});
}
function updateProjectiles(){
  for(let i=projectiles.length-1;i>=0;i--){
    const p=projectiles[i];p.x+=p.vx;p.frame++;
    if(p.x<-200||p.x>GW+200){projectiles.splice(i,1);continue}
    const opp=p.owner===0?fighters[1]:fighters[0];
    if(opp.state!=='ko'&&opp.state!=='hit'){
      const dx=Math.abs(p.x-opp.x),dy=Math.abs(p.y-(opp.y-100));
      if(dx<80&&dy<100){
        const atk=p.isSuper?ATK.superSpecial:ATK.special;
        const me=p.owner===0?fighters[0]:fighters[1];
        const blocked=opp.isBlocking();
        if(blocked){
          opp.takeHit(Math.floor(atk.dmg*me.charData.power*0.5),Math.floor(atk.kb*0.3),p.vx>0?1:-1,true);
          spawnBlock(opp.x,opp.y);sfx('block');
        }else{
          opp.takeHit(Math.floor(atk.dmg*me.charData.power),atk.kb,p.vx>0?1:-1,false);
          spawnHit(opp.x,opp.y,p.isSuper?20:15);sfx('heavy');
          shake(p.isSuper?12:8,p.isSuper?18:12);
          me.addCombo();me.addSuper(p.isSuper?40:30);
          me.stats.dmgDealt+=Math.floor(atk.dmg*me.charData.power);
          hitlag=HITLAG_FRAMES;
        }
        projectiles.splice(i,1);
      }
    }
  }
}
function drawProjectiles(){
  for(const p of projectiles){
    const spr=p.sprites[0],facing=p.vx>0?1:-1;
    ctx.save();ctx.translate(p.x,p.y);ctx.scale(facing,1);
    if(p.isSuper){ctx.shadowColor='#ffd700';ctx.shadowBlur=20}
    ctx.drawImage(spr,-p.w/2,-p.h/2,p.w,p.h);
    if(p.isSuper)ctx.shadowBlur=0;
    ctx.restore();
  }
}

// Fighter
class Fighter{
  constructor(idx,x,sprSet,charData){
    this.idx=idx;this.startX=x;this.sprSet=sprSet;this.charData=charData;
    this.stats={hitsLanded:0,maxCombo:0,dmgDealt:0};
    this.reset();
  }
  reset(){
    this.x=this.startX;this.y=GROUND;this.vx=0;this.vy=0;this.hp=100;this.displayHp=100;
    this.state='idle';this.stateT=0;this.facing=this.idx===0?1:-1;
    this.grounded=true;this.hasHit=false;this.animFrame=0;this.flashT=0;
    this.wins=this.wins||0;this.canAct=true;
    this.super=0;this.combo=0;this.comboTimer=0;this.bestCombo=0;
    this.dashT=0;this.dashDir=0;this._isSuper=false;
    this.inputBuffer=null;this.inputBufferT=0;
  }
  resetStats(){this.stats={hitsLanded:0,maxCombo:0,dmgDealt:0}}
  isBlocking(){
    if(this.state==='ko'||this.state==='hit'||this.state==='punch'||this.state==='kick'||this.state==='special'||!this.grounded)return false;
    return this._holdingBack;
  }
  addCombo(){this.combo++;this.comboTimer=90;if(this.combo>this.bestCombo)this.bestCombo=this.combo;if(this.combo>this.stats.maxCombo)this.stats.maxCombo=this.combo}
  resetCombo(){this.combo=0;this.comboTimer=0}
  addSuper(amt){this.super=Math.min(100,this.super+amt)}
  getSprite(){
    const s=this.sprSet;
    switch(this.state){
      case 'idle':return s.idle[0];
      case 'walk':return s.walk[Math.floor(this.animFrame/8)%2];
      case 'dash':return s.walk[1]||s.walk[0];
      case 'jump':return s.jump[0];
      case 'crouch':return s.crouch[0];
      case 'punch':return s.punch[0];
      case 'kick':return s.kick[0];
      case 'special':return this.stateT<ATK.special.spawnAt?s.special[0]:s.special[1];
      case 'hit':return s.hit[0];
      case 'ko':return s.ko[0];
      case 'victory':return s.victory[0];
      default:return s.idle[0];
    }
  }
  setState(st){
    if(this.state===st)return;
    this.state=st;this.stateT=0;this.hasHit=false;this.animFrame=0;
  }
  takeHit(dmg,kb,dir,blocked){
    if(this.state==='ko')return;
    const def=this.charData.defense;
    const actualDmg=blocked?dmg:Math.floor((this.state==='crouch'?dmg*0.6:dmg)/def);
    this.hp=Math.max(0,this.hp-actualDmg);
    this.vx=dir*(blocked?kb*0.4:kb);
    this.flashT=blocked?6:12;
    if(this.hp<=0){
      this.setState('ko');sfx('ko');shake(12,20);
      spawnFloat('K.O.!',this.x,this.y-200,'#ff3333',28);
    }else if(!blocked){
      this.setState('hit');
      spawnFloat(`-${actualDmg}`,this.x,this.y-180,'#ffd700',18);
      this.resetCombo();
    }else{
      spawnFloat('BLOCK!',this.x,this.y-180,'#66ccff',16);
    }
  }
  update(inp,opp){
    this.stateT++;this.animFrame++;
    if(this.flashT>0)this.flashT--;
    if(this.comboTimer>0){this.comboTimer--;if(this.comboTimer<=0)this.resetCombo()}
    this.displayHp+=(this.hp-this.displayHp)*0.12;
    if(this.inputBufferT>0)this.inputBufferT--;

    this._holdingBack=false;
    if(this.state!=='ko'){
      this.facing=this.x<opp.x?1:-1;
      if((this.facing===1&&inp.left&&!inp.right)||(this.facing===-1&&inp.right&&!inp.left))
        this._holdingBack=true;
    }
    if(!this.grounded){
      this.vy+=GRAV;this.y+=this.vy;
      if(this.y>=GROUND){
        this.y=GROUND;this.vy=0;this.grounded=true;
        spawnDust(this.x,GROUND);
        if(this.state==='jump'||this.state==='dash')this.setState('idle');
      }
    }
    if(this.state==='hit'||this.state==='ko'){this.x+=this.vx;this.vx*=0.85}
    if(this.state==='dash'){
      this.x+=this.dashDir*18*this.charData.speed;
      this.dashT--;
      if(this.dashT<=0)this.setState('idle');
    }

    // Input buffer: queue attack during another attack
    if((this.state==='punch'||this.state==='kick')&&this.stateT>this.stateT/2){
      if(inp.punch)      {this.inputBuffer='punch';this.inputBufferT=12}
      else if(inp.kick)  {this.inputBuffer='kick';this.inputBufferT=12}
      else if(inp.special){this.inputBuffer='special';this.inputBufferT=12}
    }

    const walkSpd=5.5*this.charData.speed;
    const jumpV=-17;

    switch(this.state){
      case 'idle':case 'walk':
        this.canAct=true;
        // Consume buffered input
        if(this.inputBufferT>0&&this.inputBuffer){
          const buf=this.inputBuffer;this.inputBuffer=null;this.inputBufferT=0;
          if(buf==='punch'){this.setState('punch');sfx('whoosh');break}
          if(buf==='kick'){this.setState('kick');sfx('whoosh');break}
          if(buf==='special'){
            if(this.super>=100){this.setState('special');this._isSuper=true;sfx('super');spawnSuper(this.x,this.y)}
            else{this.setState('special');this._isSuper=false}
            break;
          }
        }
        if((inp.dashL||inp.dashR)&&this.grounded&&this.state!=='dash'){
          this.setState('dash');
          this.dashDir=inp.dashR?1:-1;
          this.dashT=8;
          tapTimes[inp.dashR?P1_MAP.right+'_dash':P1_MAP.left+'_dash']=false;
          tapTimes[inp.dashR?P2_MAP.right+'_dash':P2_MAP.left+'_dash']=false;
          sfx('dash');spawnDust(this.x,GROUND);
          break;
        }
        if(inp.jump&&this.grounded){
          this.vy=jumpV;this.grounded=false;this.setState('jump');sfx('whoosh');
        }else if(inp.punch){
          this.setState('punch');sfx('whoosh');
        }else if(inp.kick){
          this.setState('kick');sfx('whoosh');
        }else if(inp.special){
          if(this.super>=100){this.setState('special');this._isSuper=true;sfx('super');spawnSuper(this.x,this.y)}
          else{this.setState('special');this._isSuper=false}
        }else if(inp.crouch){
          this.setState('crouch');
        }else if(inp.left||inp.right){
          this.setState('walk');
          const dir=inp.right?1:-1;
          this.x+=dir*(this._holdingBack?walkSpd*0.6:walkSpd);
        }else{
          this.setState('idle');
        }
        break;
      case 'jump':
        if(inp.left)this.x-=walkSpd*0.7;
        if(inp.right)this.x+=walkSpd*0.7;
        if(inp.punch&&this.canAct){this.setState('punch');this.canAct=false;sfx('whoosh')}
        else if(inp.kick&&this.canAct){this.setState('kick');this.canAct=false;sfx('whoosh')}
        break;
      case 'crouch':
        if(!inp.crouch)this.setState('idle');
        break;
      case 'punch':{
        const a=ATK.punch;
        if(this.stateT>=a.hitOn&&this.stateT<=a.hitOff&&!this.hasHit){
          const dist=(opp.x-this.x)*this.facing,dy=Math.abs(this.y-opp.y);
          if(dist>0&&dist<a.range&&dy<120&&opp.state!=='ko'){
            const blocked=opp.isBlocking();
            const airBonus=!this.grounded?1.3:1.0;
            const dmg=Math.floor(a.dmg*this.charData.power*airBonus);
            if(blocked){
              opp.takeHit(Math.floor(dmg*0.5),Math.floor(a.kb*0.3),this.facing,true);
              this.hasHit=true;spawnBlock(opp.x,opp.y);sfx('block');this.addSuper(5);
            }else{
              const comboDmg=dmg+Math.min(this.combo*2,10);
              opp.takeHit(comboDmg,a.kb,this.facing,false);
              this.hasHit=true;spawnHit(opp.x,opp.y,8);sfx('hit');shake(4,5);
              this.addCombo();this.addSuper(15);this.stats.hitsLanded++;this.stats.dmgDealt+=comboDmg;
              hitlag=HITLAG_FRAMES;
            }
          }
        }
        if(this.stateT>=a.total)this.setState(this.grounded?'idle':'jump');
        break;
      }
      case 'kick':{
        const a=ATK.kick;
        if(this.stateT>=a.hitOn&&this.stateT<=a.hitOff&&!this.hasHit){
          const dist=(opp.x-this.x)*this.facing,dy=Math.abs(this.y-opp.y);
          if(dist>0&&dist<a.range&&dy<120&&opp.state!=='ko'){
            const blocked=opp.isBlocking();
            const airBonus=!this.grounded?1.3:1.0;
            const dmg=Math.floor(a.dmg*this.charData.power*airBonus);
            if(blocked){
              opp.takeHit(Math.floor(dmg*0.5),Math.floor(a.kb*0.3),this.facing,true);
              this.hasHit=true;spawnBlock(opp.x,opp.y);sfx('block');this.addSuper(7);
            }else{
              const comboDmg=dmg+Math.min(this.combo*2,10);
              opp.takeHit(comboDmg,a.kb,this.facing,false);
              this.hasHit=true;spawnHit(opp.x,opp.y,10);sfx('hit');shake(5,7);
              this.addCombo();this.addSuper(20);this.stats.hitsLanded++;this.stats.dmgDealt+=comboDmg;
              hitlag=HITLAG_FRAMES;
            }
          }
        }
        if(this.stateT>=a.total)this.setState(this.grounded?'idle':'jump');
        break;
      }
      case 'special':{
        const isSuper=this._isSuper;
        const a=isSuper?ATK.superSpecial:ATK.special;
        if(this.stateT===a.spawnAt){
          spawnProjectile(this.idx,this.x+this.facing*60,this.y,this.facing,this.sprSet.projectile,isSuper);
          sfx(isSuper?'super':'heavy');shake(isSuper?8:3,isSuper?12:5);
          const txt=isSuper?'SUPER '+this.charData.specialText:this.charData.specialText;
          spawnFloat(txt,this.x,this.y-220,isSuper?'#ffd700':this.charData.specialColor,isSuper?18:14);
          if(isSuper){this.super=0;this._isSuper=false}
          else this.addSuper(15);
        }
        if(this.stateT>=a.total)this.setState('idle');
        break;
      }
      case 'hit':
        if(this.stateT>=18)this.setState('idle');
        break;
      case 'ko':case 'victory':break;
    }
    this.x=Math.max(50,Math.min(GW-50,this.x));
    const overlap=BODY_W-Math.abs(this.x-opp.x);
    if(overlap>0&&this.state!=='ko'&&opp.state!=='ko'){
      const push=overlap/2+1;
      if(this.x<opp.x){this.x-=push;opp.x+=push}else{this.x+=push;opp.x-=push}
    }
  }
  draw(){
    const spr=this.getSprite();if(!spr)return;
    if(this.state==='hit'&&this.flashT>0&&this.flashT%4<2)return;
    ctx.save();ctx.translate(this.x,this.y);ctx.scale(this.facing,1);
    if(this.state==='dash')ctx.globalAlpha=0.8;
    const yOff=this.state==='ko'?40:0;
    ctx.drawImage(spr,-SP_W/2,-SP_H+yOff,SP_W,SP_H);
    ctx.restore();
    if(this.state==='dash'){
      ctx.save();ctx.globalAlpha=0.3;
      ctx.translate(this.x-this.dashDir*30,this.y);ctx.scale(this.facing,1);
      ctx.drawImage(spr,-SP_W/2,-SP_H,SP_W,SP_H);
      ctx.restore();
    }
    if(this.isBlocking()&&(this.state==='idle'||this.state==='walk'||this.state==='crouch')){
      ctx.save();ctx.globalAlpha=0.3+Math.sin(this.animFrame*0.15)*0.1;
      ctx.fillStyle='#4488ff';
      ctx.beginPath();ctx.ellipse(this.x+this.facing*(-20),this.y-120,35,80,0,0,Math.PI*2);
      ctx.fill();ctx.restore();
    }
    ctx.save();ctx.globalAlpha=0.3;ctx.fillStyle='#000';
    ctx.beginPath();ctx.ellipse(this.x,GROUND+5,45,10,0,0,Math.PI*2);
    ctx.fill();ctx.restore();
    if(this.combo>=2){
      ctx.font='14px "Press Start 2P",monospace';ctx.textAlign='center';
      ctx.fillStyle='#ffd700';ctx.strokeStyle='#000';ctx.lineWidth=3;
      const txt=`${this.combo} HITS!`;
      ctx.strokeText(txt,this.x,this.y-SP_H+30);ctx.fillText(txt,this.x,this.y-SP_H+30);
    }
  }
}

// AI
class AI{
  constructor(){this.actionCooldown=0;this.nextAction='idle';this.blockTimer=0}
  getInput(me,opp){
    const inp={left:false,right:false,jump:false,crouch:false,punch:false,kick:false,special:false,dashL:false,dashR:false};
    if(me.state==='ko'||me.state==='hit')return inp;
    const dist=Math.abs(me.x-opp.x);
    const oppAttacking=opp.state==='punch'||opp.state==='kick'||opp.state==='special';
    if(oppAttacking&&dist<150&&Math.random()<0.25){
      if(me.x<opp.x)inp.left=true;else inp.right=true;
      this.blockTimer=15;return inp;
    }
    if(this.blockTimer>0){this.blockTimer--;if(me.x<opp.x)inp.left=true;else inp.right=true;return inp}
    this.actionCooldown--;
    if(this.actionCooldown<=0){
      this.actionCooldown=8+Math.floor(Math.random()*18);
      const r=Math.random();
      if(dist>250)this.nextAction='approach';
      else if(dist>140){
        if(r<0.15&&me.super>=100)this.nextAction='special';
        else if(r<0.25)this.nextAction='special';
        else if(r<0.45)this.nextAction='kick';
        else if(r<0.6)this.nextAction='approach';
        else if(r<0.7)this.nextAction='jump';
        else if(r<0.8)this.nextAction='dash';
        else this.nextAction='punch';
      }else{
        if(r<0.3)this.nextAction='punch';
        else if(r<0.5)this.nextAction='kick';
        else if(r<0.6)this.nextAction='retreat';
        else if(r<0.7)this.nextAction='jump';
        else if(r<0.8)this.nextAction='dash';
        else if(r<0.85&&me.super>=100)this.nextAction='special';
        else this.nextAction='idle';
      }
      for(const p of projectiles){
        if(p.owner!==(me===fighters[0]?0:1)&&Math.abs(p.x-me.x)<300){
          this.nextAction=Math.random()<0.6?'jump':'crouch';
          this.actionCooldown=5;
        }
      }
    }
    switch(this.nextAction){
      case 'approach':if(me.x<opp.x)inp.right=true;else inp.left=true;break;
      case 'retreat':if(me.x<opp.x)inp.left=true;else inp.right=true;break;
      case 'punch':inp.punch=true;break;
      case 'kick':inp.kick=true;break;
      case 'special':inp.special=true;break;
      case 'jump':inp.jump=true;break;
      case 'crouch':inp.crouch=true;break;
      case 'dash':if(me.x<opp.x)inp.dashR=true;else inp.dashL=true;break;
    }
    return inp;
  }
}

// Character select
function charsInTab(tab){return CHARACTERS.filter(c=>c.program===tab)}
function globalIdx(tab,local){return CHARACTERS.indexOf(charsInTab(tab)[local])}
function localIdx(tab,global){return charsInTab(tab).indexOf(CHARACTERS[global])}

function updateCharSelect(){
  selectDelay++;selectBob++;
  if(selectDelay<15){Object.keys(keys).forEach(k=>keys[k]=false);return}
  if(keys['Escape']){keys['Escape']=false;if(gameMode==='online'){cleanupOnline()}gameState='title';titleDelay=0;sfx('pause');return}
  if(gameMode==='online'){
    const myReady=onlineRole==='host'?p1Ready:p2Ready;
    if(!myReady){
      const myTab=onlineRole==='host'?p1Tab:p2Tab;
      const mySel=onlineRole==='host'?p1Sel:p2Sel;
      let newTab=myTab,newSel=mySel,changed=false;
      if(keys['KeyW']||keys['ArrowUp']){newTab=(myTab-1+PROGRAMS.length)%PROGRAMS.length;newSel=globalIdx(newTab,0);changed=true;keys['KeyW']=false;keys['ArrowUp']=false;sfx('select')}
      if(keys['KeyS']||keys['ArrowDown']){newTab=(myTab+1)%PROGRAMS.length;newSel=globalIdx(newTab,0);changed=true;keys['KeyS']=false;keys['ArrowDown']=false;sfx('select')}
      if(!changed){
        const chars=charsInTab(newTab),li=localIdx(newTab,newSel);
        if(keys['KeyA']||keys['ArrowLeft']){newSel=globalIdx(newTab,(li-1+chars.length)%chars.length);changed=true;keys['KeyA']=false;keys['ArrowLeft']=false;sfx('select')}
        if(keys['KeyD']||keys['ArrowRight']){newSel=globalIdx(newTab,(li+1)%chars.length);changed=true;keys['KeyD']=false;keys['ArrowRight']=false;sfx('select')}
      }
      if(onlineRole==='host'){p1Tab=newTab;p1Sel=newSel}else{p2Tab=newTab;p2Sel=newSel}
      if(keys['KeyF']||keys['Enter']||keys['Space']){
        if(onlineRole==='host')p1Ready=true;else p2Ready=true;
        keys['KeyF']=false;keys['Enter']=false;keys['Space']=false;sfx('confirm');changed=true;
      }
      if(changed)sendCharSelect();
    }
    if(p1Ready&&p2Ready){stateTimer++;if(stateTimer>60){
      if(onlineRole==='host')onlineChannel.send({type:'broadcast',event:'start',payload:{p1Sel,p2Sel}});
      startGame();stateTimer=0;
    }}
  }else{
    if(!p1Ready){
      if(keys['KeyW']){p1Tab=(p1Tab-1+PROGRAMS.length)%PROGRAMS.length;p1Sel=globalIdx(p1Tab,0);keys['KeyW']=false;sfx('select')}
      if(keys['KeyS']){p1Tab=(p1Tab+1)%PROGRAMS.length;p1Sel=globalIdx(p1Tab,0);keys['KeyS']=false;sfx('select')}
      const chars=charsInTab(p1Tab),li=localIdx(p1Tab,p1Sel);
      if(keys['KeyA']){p1Sel=globalIdx(p1Tab,(li-1+chars.length)%chars.length);keys['KeyA']=false;sfx('select')}
      if(keys['KeyD']){p1Sel=globalIdx(p1Tab,(li+1)%chars.length);keys['KeyD']=false;sfx('select')}
      if(keys['KeyF']||keys['Enter']){p1Ready=true;keys['KeyF']=false;keys['Enter']=false;sfx('confirm')}
    }
    if(gameMode==='cpu'){
      if(p1Ready&&!p2Ready){p2Sel=Math.floor(Math.random()*CHARACTERS.length);p2Ready=true}
    }else{
      if(!p2Ready){
        if(keys['ArrowUp']){p2Tab=(p2Tab-1+PROGRAMS.length)%PROGRAMS.length;p2Sel=globalIdx(p2Tab,0);keys['ArrowUp']=false;sfx('select')}
        if(keys['ArrowDown']){p2Tab=(p2Tab+1)%PROGRAMS.length;p2Sel=globalIdx(p2Tab,0);keys['ArrowDown']=false;sfx('select')}
        const chars=charsInTab(p2Tab),li=localIdx(p2Tab,p2Sel);
        if(keys['ArrowLeft']){p2Sel=globalIdx(p2Tab,(li-1+chars.length)%chars.length);keys['ArrowLeft']=false;sfx('select')}
        if(keys['ArrowRight']){p2Sel=globalIdx(p2Tab,(li+1)%chars.length);keys['ArrowRight']=false;sfx('select')}
        if(keys['KeyJ']||keys['Space']){p2Ready=true;keys['KeyJ']=false;keys['Space']=false;sfx('confirm')}
      }
    }
    if(p1Ready&&p2Ready){stateTimer++;if(stateTimer>(gameMode==='cpu'?30:60)){startGame();stateTimer=0}}
  }
}

// Main update
function update(){
  applyTouch();
  switch(gameState){
    case 'loading':if(loaded){gameState='title';titleDelay=0;buildStage()}break;
    case 'title':updateTitle();break;
    case 'lobby':updateLobby();break;
    case 'charSelect':updateCharSelect();break;
    case 'intro':stateTimer++;if(stateTimer>120){gameState='fighting';stateTimer=0}break;
    case 'fighting':{
      if(paused)return;
      if(hitlag>0){hitlag--;updateShake();return}
      roundTimer++;
      if(slowMo>0){slowMo--;if(slowMo%3!==0)return}
      timerAccum++;if(timerAccum>=60){timerAccum=0;timer=Math.max(0,timer-1);fighters[0].addSuper(2);fighters[1].addSuper(2)}
      let p1inp,p2inp;
      if(gameMode==='online'){
        const myInp=input(P1_MAP);
        sendOnlineInput(myInp);
        if(onlineRole==='host'){p1inp=myInp;p2inp=remoteInput||{left:false,right:false,jump:false,crouch:false,punch:false,kick:false,special:false,dashL:false,dashR:false}}
        else{p2inp=myInp;p1inp=remoteInput||{left:false,right:false,jump:false,crouch:false,punch:false,kick:false,special:false,dashL:false,dashR:false}}
      }else{
        p1inp=input(P1_MAP);
        p2inp=gameMode==='cpu'?ai.getInput(fighters[1],fighters[0]):input(P2_MAP);
      }
      fighters[0].update(p1inp,fighters[1]);
      fighters[1].update(p2inp,fighters[0]);
      updateProjectiles();updateParticles();updateFloats();updateShake();
      if(fighters[0].state==='ko'||fighters[1].state==='ko'){
        stateTimer=0;gameState='roundEnd';slowMo=15;
        if(fighters[0].state==='ko'){fighters[1].setState('victory');fighters[1].wins++}
        else{fighters[0].setState('victory');fighters[0].wins++}
      }else if(timer<=0){
        stateTimer=0;gameState='roundEnd';
        if(fighters[0].hp>fighters[1].hp){fighters[1].setState('ko');fighters[0].setState('victory');fighters[0].wins++}
        else if(fighters[1].hp>fighters[0].hp){fighters[0].setState('ko');fighters[1].setState('victory');fighters[1].wins++}
      }
      break;
    }
    case 'roundEnd':
      stateTimer++;updateParticles();updateFloats();updateShake();
      fighters[0].displayHp+=(fighters[0].hp-fighters[0].displayHp)*0.12;
      fighters[1].displayHp+=(fighters[1].hp-fighters[1].displayHp)*0.12;
      if(stateTimer>150){
        if(fighters[0].wins>=WINS_NEEDED||fighters[1].wins>=WINS_NEEDED){gameState='matchEnd';stateTimer=0;incrementMatches()}
        else{round++;resetRound();gameState='intro';stateTimer=0}
      }
      break;
    case 'matchEnd':
      stateTimer++;updateParticles();updateFloats();
      if(stateTimer>60&&keys['KeyR']){
        if(gameMode==='online'&&onlineChannel)onlineChannel.send({type:'broadcast',event:'rematch',payload:{}});
        startGame();keys['KeyR']=false;
      }else if(stateTimer>60&&(keys['Enter']||keys['Space'])){
        if(gameMode==='online')cleanupOnline();
        gameState='title';titleDelay=0;keys['Enter']=false;keys['Space']=false;
      }
      break;
  }
}

      ctx.fillText(`ROUND ${round}`,GW/2,GH/2-20);ctx.shadowBlur=0;
    }else if(t<110){
      const sc=1+(t-70)*0.02;
      ctx.save();ctx.translate(GW/2,GH/2);ctx.scale(sc,sc);
      ctx.font='64px "Press Start 2P",monospace';ctx.fillStyle='#ff3333';
      ctx.shadowColor='#ff3333';ctx.shadowBlur=30;
      ctx.fillText('FIGHT!',0,0);ctx.shadowBlur=0;ctx.restore();
    }
  }
  if(gameState==='roundEnd'&&stateTimer<80){
    ctx.textAlign='center';ctx.font='56px "Press Start 2P",monospace';
    ctx.fillStyle='#ff3333';ctx.shadowColor='#ff3333';ctx.shadowBlur=25;
    ctx.fillText(timer<=0?'TIME!':'K.O.!',GW/2,GH/2);ctx.shadowBlur=0;
    const winner=fighters[0].state==='victory'?fighters[0]:fighters[1];
    if(winner.hp>=100&&stateTimer>30){ctx.font='28px "Press Start 2P",monospace';ctx.fillStyle='#ffd700';ctx.fillText('PERFECT!',GW/2,GH/2+60)}
  }
  if(gameState==='matchEnd'){
    ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(0,0,GW,GH);
    ctx.textAlign='center';
    const winner=fighters[0].wins>=WINS_NEEDED?fighters[0]:fighters[1];
    const loser=winner===fighters[0]?fighters[1]:fighters[0];
    // Winner name
    ctx.font='36px "Press Start 2P",monospace';ctx.fillStyle='#ffd700';ctx.shadowColor='#ffd700';ctx.shadowBlur=20;
    ctx.fillText(winner.charData.fullName,GW/2,GH/2-80);
    ctx.font='48px "Press Start 2P",monospace';ctx.fillStyle='#ff6ec7';
    ctx.fillText('WINS!',GW/2,GH/2-30);ctx.shadowBlur=0;
    ctx.font='16px "Press Start 2P",monospace';ctx.fillStyle='#aaa';
    const tag=winner.idx===0?'(P1)':(gameMode==='cpu'?'(CPU)':'(P2)');
    ctx.fillText(tag,GW/2,GH/2+5);
    // Match stats
    if(stateTimer>40){
      ctx.font='8px "Press Start 2P",monospace';
      const col1=GW/2-180,col2=GW/2+180;
      const sy=GH/2+35;
      ctx.fillStyle='#66ff88';ctx.textAlign='center';ctx.fillText(fighters[0].charData.name,col1,sy);
      ctx.fillStyle='#ff6666';ctx.fillText(fighters[1].charData.name,col2,sy);
      ctx.fillStyle='#999';ctx.fillText('VS',GW/2,sy);
      const stats=[
        ['GOLPES',fighters[0].stats.hitsLanded,fighters[1].stats.hitsLanded],
        ['MAX COMBO',fighters[0].stats.maxCombo,fighters[1].stats.maxCombo],
        ['DANO TOTAL',fighters[0].stats.dmgDealt,fighters[1].stats.dmgDealt]
      ];
      stats.forEach((s,i)=>{
        const y=sy+20+i*16;
        ctx.fillStyle='#777';ctx.textAlign='center';ctx.fillText(s[0],GW/2,y);
        ctx.fillStyle='#ddd';ctx.textAlign='center';
        ctx.fillText(String(s[1]),col1,y);ctx.fillText(String(s[2]),col2,y);
      });
    }
    ctx.font='12px "Press Start 2P",monospace';ctx.textAlign='center';
    if(stateTimer>60){ctx.fillStyle='#aaa';ctx.fillText('R = revancha  |  ENTER = menu',GW/2,GH/2+110)}
    if(totalMatches>0){ctx.font='10px "Press Start 2P",monospace';ctx.fillStyle='#ff6ec7';ctx.fillText(`${totalMatches.toLocaleString()} PELEAS JUGADAS`,GW/2,GH/2+140)}
  }
  // Pause overlay
  if(paused&&gameState==='fighting'){
    ctx.fillStyle='rgba(0,0,0,0.65)';ctx.fillRect(0,0,GW,GH);
    ctx.font='48px "Press Start 2P",monospace';ctx.textAlign='center';ctx.fillStyle='#ffd700';
    ctx.shadowColor='#ffd700';ctx.shadowBlur=20;ctx.fillText('PAUSA',GW/2,GH/2-20);ctx.shadowBlur=0;
    ctx.font='14px "Press Start 2P",monospace';ctx.fillStyle='#aaa';
    ctx.fillText('ESC para continuar',GW/2,GH/2+30);
    ctx.font='10px "Press Start 2P",monospace';ctx.fillStyle='#666';
    ctx.fillText('M = mute/unmute',GW/2,GH/2+60);
  }
  ctx.restore();
}

// Game loop
const FDT=1000/60;let lastT=0,accum=0;
function loop(ts){
  const dt=Math.min(ts-lastT,100);lastT=ts;accum+=dt;
  while(accum>=FDT){update();accum-=FDT}
  render();requestAnimationFrame(loop);
}
loadAssets().then(()=>document.fonts.ready.then(()=>requestAnimationFrame(loop)));
requestAnimationFrame(loop);
window.addEventListener('beforeunload',()=>{
  if(onlineChannel){onlineChannel.send({type:'broadcast',event:'leave',payload:{}});cleanupOnline()}
});
</script>
